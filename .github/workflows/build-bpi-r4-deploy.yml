# Builds the BPI-R4 (4 GB, 8 GB, PoE) with ./build.sh bpi-r4 <variant>.
# The upstream revisions come from pins.conf; the dispatch inputs
# openwrt_commit/mtk_commit override them for a trial build.
# The images are always kept as a workflow artifact for 14 days; they replace
# the public releases only when "publish" is ticked.
name: Build BPI-R4 Deploy

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - wired
      repo_commit:
        description: 'Commit hash of this repository (leave empty for latest)'
        required: false
        default: ''
      openwrt_commit:
        description: 'OpenWrt commit hash (leave empty to use pins.conf)'
        required: false
        default: ''
      mtk_commit:
        description: 'MTK SDK commit hash (leave empty to use pins.conf)'
        required: false
        default: ''
      publish:
        description: 'Publish to the release tags (unchecked: images only as a workflow artifact)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.repo_commit || github.sha }}

      - name: Load build versions
        run: |
          grep -v '^\s*#' pins.conf | grep -v '^\s*$' >> $GITHUB_ENV
          [ -n "${{ github.event.inputs.openwrt_commit }}" ] && echo "OPENWRT_COMMIT=${{ github.event.inputs.openwrt_commit }}" >> $GITHUB_ENV || true
          [ -n "${{ github.event.inputs.mtk_commit }}" ] && echo "MTK_COMMIT=${{ github.event.inputs.mtk_commit }}" >> $GITHUB_ENV || true

      - name: Set build variables
        run: |
          VARIANT="${{ github.event.inputs.variant }}"

          if [ "$VARIANT" = "wired" ]; then
            echo "RELEASE_TAGS=release-4gb-wired release-4gb-poe-wired release-8gb-wired release-8gb-poe-wired release-8gb-wired-unifi release-8gb-poe-wired-unifi" >> $GITHUB_ENV
          else
            echo "RELEASE_TAGS=release-4gb-standard release-4gb-poe release-8gb-standard release-8gb-poe release-sdk" >> $GITHUB_ENV
          fi

      - name: Runner hardware
        run: |
          # Build times differ by up to 2x between runs of the same tree;
          # record what each runner was so slow runs can be told apart.
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)'; free -g | head -2

      - name: Free disk space on runner
        if: runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          # Self-hosted runners without apt-get must have the deps installed already
          if ! command -v apt-get >/dev/null; then
            echo "apt-get not found, skipping"
            exit 0
          fi
          SUDO=
          [ "$(id -u)" = 0 ] || SUDO="sudo -n"
          $SUDO apt-get update
          $SUDO apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git

      - name: Build
        run: ./build.sh bpi-r4 "${{ github.event.inputs.variant }}"

      - name: Prepare release artifacts
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          FILOGIC="openwrt/bin/targets/mediatek/filogic"

          # Prepare artifact directory for one release tag
          # Args: dir, itb_src, itb_dst, nvme, sdcard, emmc, snand
          make_release_dir() {
            local DIR="$1"
            local ITB_SRC="$2"
            local ITB_DST="$3"
            local NVME="$4"
            local SDCARD="$5"
            local EMMC="$6"
            local SNAND="$7"

            mkdir -p "$DIR"
            cp "${FILOGIC}/${ITB_SRC}"   "${DIR}/${ITB_DST}"
            cp "${FILOGIC}/${NVME}"      "${DIR}/${NVME}"
            cp "${FILOGIC}/${SDCARD}"    "${DIR}/${SDCARD}"
            cp "${FILOGIC}/${EMMC}"      "${DIR}/${EMMC}"
            cp "${FILOGIC}/${SNAND}"     "${DIR}/${SNAND}"
            cp "${FILOGIC}/config.buildinfo" "${DIR}/"
            cd "$DIR"
            sha256sum "${ITB_DST}" "${NVME}" "${SDCARD}" "${EMMC}" "${SNAND}" > sha256sums
            cd ..
          }

          # R4 variants
          # 4GB non-poe
          make_release_dir rel-4gb \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-squashfs-sysupgrade.itb" \
            "bpi-r4.itb" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-nvme-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-sdcard.img.gz" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-emmc-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-nand-snand-img.bin"

          # 4GB PoE
          make_release_dir rel-4gb-poe \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-squashfs-sysupgrade.itb" \
            "bpi-r4-poe.itb" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-nvme-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-sdcard.img.gz" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-emmc-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-nand-snand-img.bin"

          # 8GB non-poe
          make_release_dir rel-8gb \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-8gb-squashfs-sysupgrade.itb" \
            "bpi-r4.itb" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-8gb-nvme-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-8gb-sdcard.img.gz" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-8gb-emmc-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-nand-8gb-snand-img.bin"

          # 8GB PoE
          make_release_dir rel-8gb-poe \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-8gb-squashfs-sysupgrade.itb" \
            "bpi-r4-poe.itb" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-8gb-nvme-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-8gb-sdcard.img.gz" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-8gb-emmc-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-nand-8gb-snand-img.bin"

          # The wired build also feeds the UniFi releases: the 8 GB wired
          # firmware plus the UniFi setup scripts.
          if [ "$VARIANT" = "wired" ]; then
            cp -r rel-4gb     rel-4gb-wired
            cp -r rel-4gb-poe rel-4gb-poe-wired
            cp -r rel-8gb     rel-8gb-wired
            cp -r rel-8gb-poe rel-8gb-poe-wired

            cp -r rel-8gb     rel-8gb-unifi
            cp -r rel-8gb-poe rel-8gb-poe-unifi

            for DIR in rel-8gb-unifi rel-8gb-poe-unifi; do
              cp boards/bpi-r4/unifi/unifi-setup.sh             "$DIR/"
              cp boards/bpi-r4/unifi/rc.local                   "$DIR/"
              cp boards/bpi-r4/unifi/rc-network.sh              "$DIR/"
              cp boards/bpi-r4/unifi/unifi-network-setup-8gb.sh "$DIR/unifi-network-setup.sh"
            done
          fi

      # Atomic release: delete old releases/tags only AFTER a successful build +
      # artifact prep, so a build failure leaves the existing releases intact.
      # The U-Boot in the eMMC image boots the ITB configuration named in its
      # bootconf; a wrong one (8 GB PoE carried the non-PoE one until 2026-10)
      # leaves the board without a system. The FIP sits at 6656k.
      - name: Check the U-Boot board configuration in the images
        run: |
          check() {
            dd if="$1" bs=1k skip=6656 count=4096 2>/dev/null | strings | grep -qx "bootconf=$2" \
              || { echo "$1: U-Boot does not boot $2"; exit 1; }
            echo "$1: $2"
          }
          for DIR in rel-4gb rel-8gb; do
            check "$(ls $DIR/*-emmc-img.bin)" config-mt7988a-bananapi-bpi-r4
          done
          for DIR in rel-4gb-poe rel-8gb-poe; do
            check "$(ls $DIR/*-emmc-img.bin)" config-mt7988a-bananapi-bpi-r4-poe
          done
          # NAND images: the U-Boot in the fip volume must match the board and
          # carry the NVMe boot that install-nvme.sh switches on.
          check_snand() {
            strings "$1" | grep -qx "bootconf=$2" \
              || { echo "$1: NAND U-Boot does not boot $2"; exit 1; }
            strings "$1" | grep -q "^boot_nvme=" \
              || { echo "$1: NAND U-Boot has no boot_nvme"; exit 1; }
            echo "$1: $2, boot_nvme"
          }
          for DIR in rel-4gb rel-8gb; do
            check_snand "$(ls $DIR/*-snand-img.bin)" config-mt7988a-bananapi-bpi-r4
          done
          for DIR in rel-4gb-poe rel-8gb-poe; do
            check_snand "$(ls $DIR/*-snand-img.bin)" config-mt7988a-bananapi-bpi-r4-poe
          done

      - name: Upload images as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: images-bpi-r4-${{ github.event.inputs.variant }}
          path: |
            rel-4gb/*.itb
            rel-4gb/openwrt-*-sdcard.img.gz
            rel-4gb/config.buildinfo
            rel-4gb-poe/*.itb
            rel-4gb-poe/openwrt-*-sdcard.img.gz
            rel-8gb/*.itb
            rel-8gb/openwrt-*-sdcard.img.gz
            rel-8gb-poe/*.itb
            rel-8gb-poe/openwrt-*-sdcard.img.gz
          if-no-files-found: error
          retention-days: 14

      - name: Delete existing releases and tags
        if: github.event.inputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tags = process.env.RELEASE_TAGS.split(' ');

            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });

            for (const tag of tags) {
              for (const rel of releases.data) {
                if (rel.tag_name === tag) {
                  await github.rest.repos.deleteRelease({
                    owner,
                    repo,
                    release_id: rel.id
                  }).catch(e => console.log(`Failed to delete release ${rel.id}: ${e.message}`));
                }
              }
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag}`
              }).catch(e => console.log(`Failed to delete tag ${tag}: ${e.message}`));
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish luci-app-wifimgr APK
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'standard')
        run: |
          APK=$(ls openwrt/bin/packages/aarch64_cortex-a53/luci/luci-app-wifimgr-*.apk 2>/dev/null | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK_NAME=$(basename $APK)" >> $GITHUB_ENV

      - name: Publish wifimgr-latest release
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'standard')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wifimgr-latest
          name: "luci-app-wifimgr (latest)"
          body: |
            Standalone APK for luci-app-wifimgr — install on any BPI-R4 running this firmware.

            ```
            apk add --allow-untrusted --no-network /tmp/${{ env.APK_NAME }}
            ```

            Built from commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-sdk
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'standard')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-sdk
          name: "OpenWrt SDK (latest)"
          body: |
            OpenWrt SDK for mediatek/filogic (aarch64_cortex-a53) — compile custom packages for this firmware without building the whole tree.

            Covers all BPI-R4 variants including Pro 8X (same target/arch). Userspace packages only; kernel modules need a kernel-matched SDK.

            ```
            tar xf openwrt-sdk-*.tar.zst && cd openwrt-sdk-*
            ./scripts/feeds update -a && ./scripts/feeds install <pkg>
            make package/<pkg>/compile V=s
            ```

            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: openwrt/bin/targets/mediatek/filogic/openwrt-sdk-*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-4gb-standard
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'standard')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-4gb-standard
          name: "BPI-R4 4GB standard WiFi (latest)"
          body: |
            Variant: standard (WiFi) | RAM: 4GB
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-4gb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-4gb-poe
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'standard')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-4gb-poe
          name: "BPI-R4 4GB PoE WiFi (latest)"
          body: |
            Variant: standard (WiFi) | RAM: 4GB | PoE
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-4gb-poe/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-standard
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'standard')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-standard
          name: "BPI-R4 8GB standard WiFi (latest)"
          body: |
            Variant: standard (WiFi) | RAM: 8GB
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-poe
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'standard')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-poe
          name: "BPI-R4 8GB PoE WiFi (latest)"
          body: |
            Variant: standard (WiFi) | RAM: 8GB | PoE
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb-poe/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-4gb-wired
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'wired')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-4gb-wired
          name: "BPI-R4 4GB wired (latest)"
          body: |
            Variant: wired (no WiFi) | RAM: 4GB
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-4gb-wired/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-4gb-poe-wired
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'wired')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-4gb-poe-wired
          name: "BPI-R4 4GB PoE wired (latest)"
          body: |
            Variant: wired (no WiFi) | RAM: 4GB | PoE
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-4gb-poe-wired/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-wired
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'wired')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-wired
          name: "BPI-R4 8GB wired (latest)"
          body: |
            Variant: wired (no WiFi) | RAM: 8GB
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb-wired/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-poe-wired
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'wired')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-poe-wired
          name: "BPI-R4 8GB PoE wired (latest)"
          body: |
            Variant: wired (no WiFi) | RAM: 8GB | PoE
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb-poe-wired/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-wired-unifi
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'wired')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-wired-unifi
          name: "BPI-R4 8GB wired UniFi (latest)"
          body: |
            Variant: wired (no WiFi) | RAM: 8GB | UniFi stack
            Includes: unifi-setup.sh, unifi-network-setup.sh, rc.local, rc-network.sh
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb-unifi/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-poe-wired-unifi
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'wired')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-poe-wired-unifi
          name: "BPI-R4 8GB PoE wired UniFi (latest)"
          body: |
            Variant: wired (no WiFi) | RAM: 8GB | PoE | UniFi stack
            Includes: unifi-setup.sh, unifi-network-setup.sh, rc.local, rc-network.sh
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb-poe-unifi/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
