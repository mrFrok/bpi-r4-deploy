# Every upstream revision an image is built from, in one place, for both
# boards. build.sh and the workflows read this file; a value already set in
# the environment wins (e.g. MTK_COMMIT=<sha> ./build.sh bpi-r4 standard),
# and such a build is no longer the tested one.
#
# Plain KEY=VALUE lines only: the workflows append them to $GITHUB_ENV.
#
# The OpenWrt and MTK commits MUST move together: MTK feed patches are
# rebased per kernel, and a new feed on an old kernel (or the reverse) fails
# to patch an hour into the build.
#
# 2026-10-26: openwrt-25.12 f3f5c2e5 (kernel 6.12.112) + MTK main c21f3b36.
# MTK now fetches mt76/mac80211/hostapd/iw/wifi-scripts from
# github.com/mediatek/softmac_* at a moving branch; the SOFTMAC_* commits pin
# them (common/softmac-pin.sh). iw and wifi-scripts were pinned 2026-10-27 at
# the branch heads the 2026-10-26 images were built from.
# Earlier pins are in the git history of this file (build-versions.env
# before 2026-10).
OPENWRT_COMMIT=f3f5c2e54bf432b444e36b1a77077ff476361825
MTK_COMMIT=c21f3b3617be249a1408a5e9daa66d402dd555bb
SOFTMAC_MT76=7117d4f04a103cfa39bca63c1cce8eaa7e18a263
SOFTMAC_MAC80211=583ea44cd2be2f843412ffd9e727bf6134d55ca3
SOFTMAC_HOSTAPD=611070267e83dc4f26783d400a139c3d1494378a
SOFTMAC_IW=96d9639ad71d91d5e6ddb96fe582482a8ec55a05
SOFTMAC_WIFI_SCRIPTS=17e9e280e7d036d6fe1e1fe5e435fd186b4183f5

# Third-party LuCI theme (github.com/ChesterGoodiny/luci-theme-proton2025)
PROTON2025_TAG=v1.4.5
